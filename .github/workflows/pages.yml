name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/cozy-topdown-game-orbrhu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Hier sind zweiundfünfzig Läufe nacheinander gescheitert, immer mit
      # „Get Pages site failed: Not Found". GitHub Pages ist für dieses Repo
      # schlicht nicht eingeschaltet.
      #
      # `enablement: true` soll das selbst erledigen — kann es aber nicht: der
      # GITHUB_TOKEN eines Laufs darf keine Pages-Seite anlegen („Resource not
      # accessible by integration"). Das geht nur einmal von Hand:
      #   Settings → Pages → Build and deployment → Source: GitHub Actions
      # Danach läuft dieser Schritt durch, und jeder Push veröffentlicht.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Die Einzeldatei wird vor dem Hochladen frisch gebaut, damit unter
      # offline/talkunde.html immer die Fassung liegt, die auch online steht.
      - run: node werkzeug/einzeldatei.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
