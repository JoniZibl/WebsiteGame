name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/cozy-topdown-game-orbrhu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement schaltet GitHub Pages beim ersten Lauf selbst ein. Ohne das
      # bricht dieser Schritt ab, solange in den Repo-Einstellungen niemand
      # von Hand auf „GitHub Actions" gestellt hat — und genau daran sind hier
      # einundfünfzig Läufe nacheinander gescheitert.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
