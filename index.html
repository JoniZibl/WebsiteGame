<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#cdd6ad" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Cozy Grove — Prototyp</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🏕️</text></svg>" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="top-left">
      <div class="bar" id="hpBar"><div class="fill" id="hpFill"></div><span id="hpText">100</span></div>
      <div class="chips">
        <div class="chip"><span class="ic">💎</span><span id="score">0</span></div>
        <div class="chip"><span class="ic">🗺️</span><span id="area">0, 0</span></div>
      </div>
    </div>
    <button id="qualityBtn" class="ghost-btn" title="Grafik umschalten">✨</button>
  </div>

  <div id="hint" class="hint hidden">Loslassen &rarr; schie&szlig;en</div>

  <!-- Joystick -->
  <div id="stick" class="hidden"><div id="stickBase"></div><div id="stickNub"></div></div>

  <!-- Overlays -->
  <div id="start" class="overlay">
    <div class="card">
      <h1>Cozy Grove</h1>
      <p class="sub">Ein kleiner, ruhiger Prototyp</p>
      <ul class="how">
        <li><b>Ziehen</b> (oder <b>WASD</b>) &rarr; laufen</li>
        <li><b>Loslassen</b> &rarr; du zielst &amp; schie&szlig;t automatisch</li>
        <li>Die Welt wird endlos neu erzeugt</li>
      </ul>
      <button id="startBtn" class="primary">Losziehen</button>
    </div>
  </div>

  <div id="dead" class="overlay hidden">
    <div class="card">
      <h1>Ausgeruht</h1>
      <p class="sub">Du wachst wieder am Lagerfeuer auf.</p>
      <p class="big" id="deadScore">0 💎</p>
      <button id="againBtn" class="primary">Nochmal</button>
    </div>
  </div>

  <noscript><div class="overlay"><div class="card"><h1>JavaScript nötig</h1></div></div></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
